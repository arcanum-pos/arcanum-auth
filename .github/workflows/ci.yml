# Every push and pull request (HARDENING.md, phase 2): the checks that stand
# in for a WAF in front of this IdP. Workers Builds deploys a push to main
# itself; its build command runs `npm run check` too, so a red push isn't
# deployed (README, "Checks before deploy").
name: CI

on:
  push:
  pull_request:
  schedule:
    # Weekly, for advisories published since the last push.
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # What's deployed (jose, @simplewebauthn/server): no known high or
      # critical vulnerability. The test tooling (miniflare) is never deployed.
      - run: npm audit --omit=dev --audit-level=high

  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - run: semgrep scan --config p/typescript --config p/javascript --config p/secrets --config p/jwt --metrics=off --error src

  # OWASP ZAP's baseline (passive: it only looks at the answers) against a
  # local copy - `wrangler dev`, its own throwaway keys and database, no mail.
  zap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: A local issuer
        run: |
          {
            echo "SIGNING_KEY=$(node scripts/generate-signing-key.mjs)"
            echo "ADMIN_API_KEY=$(openssl rand -base64 32)"
            echo "CODE_HASH_KEY=$(openssl rand -base64 32)"
            echo "ISSUER=http://localhost:8788"
          } > .dev.vars
          npx wrangler d1 migrations apply arcanum-auth --local
          npx wrangler dev --port 8788 --ip 0.0.0.0 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8788/health && break; sleep 2; done
      - uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:8788/login
          cmd_options: '-a -j'
          # Triaged findings, each with its reason (.zap/rules.tsv); anything new fails.
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          fail_action: true
      - if: failure()
        run: cat wrangler.log
