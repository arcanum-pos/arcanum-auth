<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>arcanum-auth admin</title>
<style>
:root{--bg:#fafafa;--card:#fff;--fg:#0a0a0a;--muted:#737373;--border:#e5e5e5;--primary:#0a0a0a;--on-primary:#fff;--danger:#b91c1c;--warn-bg:#fef3c7;--warn-fg:#92400e;--ok-bg:#dcfce7;--ok-fg:#166534}
@media (prefers-color-scheme:dark){:root{--bg:#0a0a0a;--card:#171717;--fg:#fafafa;--muted:#a3a3a3;--border:#262626;--primary:#fafafa;--on-primary:#0a0a0a;--danger:#f87171;--warn-bg:#422006;--warn-fg:#fcd34d;--ok-bg:#052e16;--ok-fg:#86efac}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px}
main{max-width:960px;margin:0 auto;display:grid;gap:16px}
section{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px}
h1{font-size:20px;margin:0;letter-spacing:-.02em}h2{font-size:16px;margin:0 0 12px}
p{margin:0 0 10px;color:var(--muted)}
label{display:block;font-size:12.5px;font-weight:600;margin:10px 0 4px}
input,textarea{width:100%;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--fg);padding:8px 10px;font:inherit}
textarea{font:12.5px/1.5 ui-monospace,monospace;resize:vertical}
button{height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--primary);background:var(--primary);color:var(--on-primary);font:600 13.5px system-ui,sans-serif;cursor:pointer;white-space:nowrap}
button.secondary{background:transparent;color:var(--fg);border-color:var(--border)}
button.danger{background:transparent;color:var(--danger);border-color:var(--border)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>input{flex:1 1 220px;width:auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--border);color:var(--fg)}
.badge.warn{background:var(--warn-bg);color:var(--warn-fg)}.badge.ok{background:var(--ok-bg);color:var(--ok-fg)}
code{font:12.5px ui-monospace,monospace;word-break:break-all}
.client{border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.client.disabled{opacity:.6}
.client .name{font-size:15px;font-weight:650}
.hosts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14.5px;align-items:center}.hosts .host{display:inline-flex;gap:6px;align-items:center}.hosts a{color:var(--fg);text-decoration:none;font-weight:500}.hosts a:hover{text-decoration:underline}
.facts{display:grid;gap:1px;font-size:12.5px;color:var(--muted)}.facts code{font-size:12px}
.clients{display:grid;gap:10px}
.meta{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.msg{font-size:13px;margin-top:10px}.msg.error{color:var(--danger)}
.secret{border:1px solid var(--warn-fg);background:var(--warn-bg);color:var(--warn-fg);border-radius:10px;padding:12px;margin-top:12px}
.secret code{color:var(--fg)}
details summary{cursor:pointer;font-weight:600;font-size:13px}
.check{display:flex;gap:8px;align-items:center;font-weight:400;font-size:13.5px;margin-top:12px}.check input{width:auto;margin:0}
.signin{display:grid;gap:8px;justify-items:end;min-width:min(100%,360px)}.signin details{width:100%;text-align:right}.signin form{margin-top:6px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<section>
  <div class="top">
    <div><h1>arcanum-auth admin</h1><p id="instance">Not signed in</p><div id="protections" class="row"></div></div>
    <div class="signin">
      <div class="row" id="signedOut">
        <button type="button" id="signIn">Sign in with a passkey</button>
      </div>
      <div class="row" id="signedIn" hidden><span id="who" class="meta"></span><button type="button" id="signOut" class="secondary">Sign out</button></div>
      <details id="keyBox"><summary class="meta">Use the admin key instead</summary>
        <p class="meta" style="margin-top:6px">The way back in when signing in doesn't work: this instance's ADMIN_API_KEY.</p>
        <form id="keyForm" class="row">
          <input id="key" type="password" placeholder="ADMIN_API_KEY" autocomplete="off" aria-label="Admin API key">
          <button type="submit" class="secondary">Use key</button>
        </form>
      </details>
    </div>
  </div>
  <p class="msg error" id="keyError" hidden></p>
</section>

<div id="app" hidden>
<section>
  <div class="top"><h2>Clients</h2><div class="row"><input id="search" type="search" placeholder="Search name, address, owner, id" aria-label="Search clients" style="width:260px"><button class="secondary" id="reload">Refresh</button></div></div>
  <div class="clients" id="clients"></div>
</section>

<section>
  <h2>New client</h2>
  <form id="newClient">
    <div class="grid2">
      <div><label for="ncName">Name</label><input id="ncName" required maxlength="100" placeholder="Scouts Elewijt"></div>
      <div><label for="ncApp">App address (fills in the two lists)</label><input id="ncApp" placeholder="https://arcanum.example.be"></div>
    </div>
    <div class="grid2">
      <div><label for="ncRedirects">Redirect URIs, one per line</label><textarea id="ncRedirects" rows="2" required placeholder="https://arcanum.example.be/callback"></textarea></div>
      <div><label for="ncLogouts">Logout return addresses, one per line</label><textarea id="ncLogouts" rows="2" placeholder="https://arcanum.example.be"></textarea></div>
    </div>
    <div class="grid2">
      <div><label for="ncOwner">Owner e-mail (first admin of its access list)</label><input id="ncOwner" type="email" placeholder="optional"></div>
      <div><label for="ncInstance">Instance address (for support)</label><input id="ncInstance" placeholder="optional"></div>
    </div>
    <label class="check"><input id="ncRestricted" type="checkbox" checked> Restricted: only addresses on its access list can sign in</label>
    <div class="row" style="margin-top:12px"><button type="submit">Create client</button></div>
    <p class="msg" id="ncMsg" hidden></p>
    <div class="secret" id="ncSecret" hidden></div>
  </form>
</section>

<div class="grid2">
<section>
  <h2>Passkeys lost</h2>
  <p>Removes all passkeys of an account; they're told by mail and sign in with a mailed code.</p>
  <form id="passkeys" class="row"><input id="pkEmail" type="email" required placeholder="someone@example.be" aria-label="E-mail"><button type="submit" class="danger">Remove passkeys</button></form>
  <p class="msg" id="pkMsg" hidden></p>
</section>

<section>
  <h2>Mail</h2>
  <div id="mail"><p>…</p></div>
  <form id="testMail" class="row" style="margin-top:10px"><input id="tmTo" type="email" required placeholder="send a test mail to" aria-label="Test mail address"><button type="submit" class="secondary">Send test mail</button></form>
  <p class="msg" id="tmMsg" hidden></p>
</section>
</div>
</div>
</main>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  // What the admin API gets as Bearer: a token from signing in (an hour,
  // a passkey each time) or the admin key. Only in this tab.
  var STORE = 'arcanum-auth-admin';
  var SIGNIN = 'arcanum-auth-admin-signin';
  function read(name) { try { return JSON.parse(sessionStorage.getItem(name) || 'null'); } catch (e) { return null; } }
  function write(name, v) { try { if (v) sessionStorage.setItem(name, JSON.stringify(v)); else sessionStorage.removeItem(name); } catch (e) {} }
  var cred = read(STORE); // { bearer, kind: 'token'|'key', expires? }
  if (cred && cred.expires && cred.expires < Date.now()) cred = null;
  var key = cred ? cred.bearer : '';

  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function lines(v) { return v.split('\n').map(function (l) { return l.trim(); }).filter(Boolean); }
  function when(iso) { return iso ? new Date(iso).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) : 'never'; }
  function day(iso) { return iso ? new Date(iso).toLocaleDateString(undefined, { dateStyle: 'medium' }) : ''; }
  function show(el, text, error) { el.textContent = text; el.className = 'msg' + (error ? ' error' : ''); el.hidden = !text; }

  function api(method, path, body) {
    var init = { method: method, headers: { Authorization: 'Bearer ' + key } };
    if (body !== undefined) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(body); }
    return fetch(path, init).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (res.status === 401 && path !== '/admin/info') signedOut('The sign-in ran out (an hour) - sign in again.');
        if (!res.ok) { var e = new Error(data.error || ('HTTP ' + res.status)); e.status = res.status; throw e; }
        return data;
      });
    });
  }

  var LABELS = {
    turnstile: 'Turnstile not set', turnstile_keys: 'Turnstile: test or malformed keys', turnstile_secret: 'Turnstile: secret refused',
    mail_off: 'Mail switched off', mail_unset: 'No mailer or mail account'
  };

  function b64u(bytes) { var s = ''; for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  function random() { return b64u(crypto.getRandomValues(new Uint8Array(32))); }

  // Sign in: arcanum-auth's own page (a passkey), back to /callback with a code.
  $('signIn').addEventListener('click', function () {
    show($('keyError'), '');
    fetch('/oidc').then(function (r) { return r.json(); }).then(function (o) {
      if (o.error) throw new Error(o.error);
      var verifier = random(), state = random();
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)).then(function (hash) {
        write(SIGNIN, { verifier: verifier, state: state });
        var q = new URLSearchParams({ response_type: 'code', client_id: o.client_id, redirect_uri: o.redirect_uri, scope: 'openid email', state: state, code_challenge: b64u(new Uint8Array(hash)), code_challenge_method: 'S256', prompt: 'login' });
        location.href = o.authorization_endpoint + '?' + q;
      });
    }).catch(function (e) { show($('keyError'), 'Could not reach arcanum-auth: ' + e.message, true); });
  });

  function finishSignIn() {
    var q = new URLSearchParams(location.search), pending = read(SIGNIN);
    write(SIGNIN, null);
    history.replaceState(null, '', '/');
    if (q.get('error')) return Promise.resolve(show($('keyError'), 'Signing in did not work: ' + (q.get('error_description') || q.get('error')), true));
    if (!pending || q.get('state') !== pending.state) return Promise.resolve(show($('keyError'), 'That sign-in was not started here - try again.', true));
    return fetch('/exchange', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: q.get('code'), verifier: pending.verifier }) })
      .then(function (r) { return r.json(); }).then(function (t) {
        if (t.error) throw new Error(t.error);
        cred = { bearer: t.access_token, kind: 'token', expires: Date.now() + (t.expires_in - 60) * 1000 };
        write(STORE, cred); key = cred.bearer;
        return connect();
      }).catch(function (e) { show($('keyError'), 'Signing in did not work: ' + e.message, true); });
  }

  function signedOut(message) {
    write(STORE, null); cred = null; key = '';
    $('app').hidden = true; $('signedIn').hidden = true; $('signedOut').hidden = false; $('keyBox').hidden = false;
    $('instance').textContent = 'Not signed in'; $('protections').innerHTML = '';
    if (message) show($('keyError'), message, true);
  }

  function connect() {
    show($('keyError'), '');
    return api('GET', '/admin/info').then(function (info) {
      write(STORE, cred);
      $('who').textContent = info.you === 'key' ? 'With the admin key' : 'Signed in as ' + info.you;
      $('signedIn').hidden = false; $('signedOut').hidden = true; $('keyBox').hidden = true; $('keyBox').open = false;
      $('instance').innerHTML = 'Connected to <code>' + esc(info.issuer) + '</code>';
      $('protections').innerHTML = info.protections_off.length
        ? info.protections_off.map(function (p) { return '<span class="badge warn">' + esc(LABELS[p] || p) + '</span>'; }).join('')
        : '<span class="badge ok">Turnstile and mail on</span>';
      $('app').hidden = false; $('key').value = '';
      loadClients(); loadMail();
    }).catch(function (e) {
      var was = cred && cred.kind;
      signedOut(e.status === 401
        ? (was === 'key' ? 'That key is not this instance\'s ADMIN_API_KEY.' : 'Not an admin here (ADMIN_EMAILS), or the sign-in ran out - sign in again.')
        : e.status === 404 ? 'arcanum-auth refused the call as coming from the internet - is this the tools/admin Worker?' : 'Could not reach arcanum-auth: ' + e.message);
    });
  }

  // The addresses that tell a client apart (arcanum-auth's distinctiveHosts):
  // its own domains, or only its one workers.dev address. All: under "Addresses".
  function shownHosts(c) { return c.hosts || []; }

  // Arcanum installations: which release each address runs (its bff's public
  // /version, asked through this tool's Worker). Only the addresses an
  // installation signs in through (a /callback there); other apps have none.
  var releases = {};
  function installationHosts(c) {
    return shownHosts(c).filter(function (h) {
      return c.redirect_uris.some(function (u) { try { var x = new URL(u); return x.host === h && x.pathname === '/callback'; } catch (e) { return false; } });
    });
  }
  function releaseBadge(h) {
    var r = releases[h];
    if (!r) return '<span class="badge" data-release="' + esc(h) + '">…</span>';
    return r.ok ? '<span class="badge ok" data-release="' + esc(h) + '">' + esc(r.release || 'version unknown') + '</span>'
      : '<span class="badge warn" data-release="' + esc(h) + '">not answering</span>';
  }
  function checkReleases(list) {
    list.forEach(function (c) {
      if (c.disabled_at) return;
      installationHosts(c).forEach(function (h) {
        if (releases[h]) return;
        fetch('/version?host=' + encodeURIComponent(h)).then(function (r) { return r.json(); }).catch(function () { return { ok: false }; }).then(function (r) {
          releases[h] = r;
          document.querySelectorAll('[data-release="' + h + '"]').forEach(function (el) { el.outerHTML = releaseBadge(h); });
        });
      });
    });
  }

  var clients = [];
  function render() {
    var q = $('search').value.trim().toLowerCase();
    var list = clients.filter(function (c) {
      return !q || [c.name, c.shown_name || '', c.client_id, c.owner_email || ''].concat(c.redirect_uris, c.post_logout_redirect_uris).join(' ').toLowerCase().indexOf(q) >= 0;
    });
    $('clients').innerHTML = list.length ? list.map(clientHtml).join('') : '<p>' + (clients.length ? 'No client matches.' : 'No clients yet.') + '</p>';
  }
  $('search').addEventListener('input', render);

  function loadClients() {
    return api('GET', '/admin/clients').then(function (list) {
      list.sort(function (a, b) { return (!!a.disabled_at - !!b.disabled_at) || a.name.localeCompare(b.name); });
      clients = list; releases = {}; render(); checkReleases(list);
    }).catch(function (e) { $('clients').innerHTML = '<p class="msg error">' + esc(e.message) + '</p>'; });
  }

  function clientHtml(c) {
    var id = esc(c.client_id);
    var badges = c.disabled_at ? '<span class="badge warn">Disabled ' + esc(when(c.disabled_at)) + '</span>'
      : (c.restricted ? '<span class="badge">Restricted</span>' : '<span class="badge ok">Open</span>') + (c.require_passkey ? ' <span class="badge">Passkey required</span>' : '');
    var actions = c.disabled_at
      ? '<button class="danger" data-act="delete" data-id="' + id + '" data-name="' + esc(c.name) + '">Delete for good</button>'
      : '<button class="secondary" data-act="restricted" data-id="' + id + '" data-value="' + !c.restricted + '">' + (c.restricted ? 'Open to everyone' : 'Restrict') + '</button>' +
        '<button class="secondary" data-act="passkey" data-id="' + id + '" data-value="' + !c.require_passkey + '">' + (c.require_passkey ? 'Passkey not required' : 'Require passkey') + '</button>' +
        '<button class="danger" data-act="disable" data-id="' + id + '" data-name="' + esc(c.name) + '">Disable</button>';
    var edit = c.disabled_at ? '' :
      '<details><summary>Addresses</summary><form data-uris="' + id + '">' +
      '<div class="grid2"><div><label>Redirect URIs</label><textarea name="r" rows="' + Math.max(2, c.redirect_uris.length) + '">' + esc(c.redirect_uris.join('\n')) + '</textarea></div>' +
      '<div><label>Logout return addresses</label><textarea name="l" rows="' + Math.max(2, c.post_logout_redirect_uris.length) + '">' + esc(c.post_logout_redirect_uris.join('\n')) + '</textarea></div></div>' +
      '<div class="row" style="margin-top:8px"><button type="submit" class="secondary">Save addresses</button></div></form></details>';
    var hosts = shownHosts(c);
    return '<div class="client' + (c.disabled_at ? ' disabled' : '') + '">' +
      '<div class="top"><div class="name">' + esc(c.shown_name || c.name) + '</div><div class="row">' + badges + '</div></div>' +
      (hosts.length ? '<div class="hosts">' + hosts.map(function (h) {
        var release = !c.disabled_at && installationHosts(c).indexOf(h) >= 0 ? ' ' + releaseBadge(h) : '';
        return '<span class="host"><a href="https://' + esc(h) + '" target="_blank" rel="noopener noreferrer">' + esc(h) + '</a>' + release + '</span>';
      }).join('') + '</div>' : '') +
      '<div class="facts">' +
        (c.owner_email ? '<div>Owner ' + esc(c.owner_email) + '</div>' : '') +
        '<div>Last used ' + esc(when(c.last_used_at)) + ' · ' + c.active_users + ' active ' + (c.active_users === 1 ? 'user' : 'users') + ' in 30 days</div>' +
        '<div>Created ' + esc(day(c.created_at)) + ' · <code>' + id + '</code></div>' +
      '</div>' +
      '<div class="row">' + actions + '</div>' + edit + '<p class="msg" data-msg="' + id + '" hidden></p></div>';
  }

  function clientMsg(id, text, error) { var el = document.querySelector('[data-msg="' + id + '"]'); if (el) show(el, text, error); }

  $('clients').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-act]'); if (!b) return;
    var id = b.dataset.id, act = b.dataset.act, call;
    if (act === 'restricted') call = api('PATCH', '/admin/clients/' + encodeURIComponent(id), { restricted: b.dataset.value === 'true' });
    else if (act === 'passkey') call = api('PATCH', '/admin/clients/' + encodeURIComponent(id), { require_passkey: b.dataset.value === 'true' });
    else if (act === 'disable') { if (!confirm('Disable ' + b.dataset.name + '? Nobody can sign in to it any more.' + (cred && cred.kind === 'token' ? ' Its owner is mailed when that is not you.' : ''))) return; call = api('DELETE', '/admin/clients/' + encodeURIComponent(id)); }
    else if (act === 'delete') { if (!confirm('Delete ' + b.dataset.name + ' for good, with its tokens and access list? This cannot be undone.')) return; call = api('DELETE', '/admin/clients/' + encodeURIComponent(id) + '?hard=1'); }
    b.disabled = true;
    call.then(loadClients).catch(function (err) { b.disabled = false; clientMsg(id, err.message, true); });
  });

  $('clients').addEventListener('submit', function (e) {
    var f = e.target.closest('form[data-uris]'); if (!f) return;
    e.preventDefault();
    var id = f.dataset.uris;
    api('PATCH', '/admin/clients/' + encodeURIComponent(id), { redirect_uris: lines(f.r.value), post_logout_redirect_uris: lines(f.l.value) })
      .then(function () { clientMsg(id, 'Addresses saved.'); }).catch(function (err) { clientMsg(id, err.message, true); });
  });

  $('ncApp').addEventListener('input', function () {
    var base = this.value.trim().replace(/\/+$/, '');
    if (!base) return;
    $('ncRedirects').value = base + '/callback';
    $('ncLogouts').value = base;
    if (!$('ncInstance').value || $('ncInstance').dataset.auto) { $('ncInstance').value = base; $('ncInstance').dataset.auto = '1'; }
  });
  $('ncInstance').addEventListener('input', function () { delete this.dataset.auto; });

  $('newClient').addEventListener('submit', function (e) {
    e.preventDefault();
    show($('ncMsg'), ''); $('ncSecret').hidden = true;
    var body = { name: $('ncName').value.trim(), redirect_uris: lines($('ncRedirects').value), post_logout_redirect_uris: lines($('ncLogouts').value), restricted: $('ncRestricted').checked };
    if ($('ncOwner').value.trim()) body.owner_email = $('ncOwner').value.trim();
    if ($('ncInstance').value.trim()) body.instance_url = $('ncInstance').value.trim();
    api('POST', '/admin/clients', body).then(function (c) {
      $('ncSecret').innerHTML = '<strong>Created. Copy the secret now - it is never shown again.</strong>' +
        '<div style="margin-top:8px">Issuer <code>' + esc(c.issuer) + '</code></div>' +
        '<div>Client id <code>' + esc(c.client_id) + '</code></div>' +
        '<div>Client secret <code>' + esc(c.client_secret) + '</code></div>' +
        '<div class="row" style="margin-top:8px"><button type="button" class="secondary" id="copySecret">Copy all three</button></div>';
      $('ncSecret').hidden = false;
      $('copySecret').onclick = function () {
        navigator.clipboard.writeText('ISSUER=' + c.issuer + '\nCLIENT_ID=' + c.client_id + '\nCLIENT_SECRET=' + c.client_secret).then(function () { $('copySecret').textContent = 'Copied'; });
      };
      $('newClient').reset(); delete $('ncInstance').dataset.auto;
      loadClients();
    }).catch(function (err) { show($('ncMsg'), err.message, true); });
  });

  $('passkeys').addEventListener('submit', function (e) {
    e.preventDefault();
    var email = $('pkEmail').value.trim();
    if (!confirm('Remove all passkeys of ' + email + '?')) return;
    api('DELETE', '/admin/users/' + encodeURIComponent(email) + '/passkeys').then(function (r) {
      show($('pkMsg'), r.removed + ' passkey(s) removed; ' + email + ' gets a mail.'); $('passkeys').reset();
    }).catch(function (err) { show($('pkMsg'), err.status === 404 ? 'No account with that address.' : err.message, true); });
  });

  function loadMail() {
    api('GET', '/admin/mail').then(function (m) {
      var used = m.active === 'settings' ? m.stored : m.active === 'secret' ? m.secret : null;
      $('mail').innerHTML = used
        ? '<p>Sends through <strong>' + esc(used.provider) + '</strong>' + (used.values && used.values.fromAddress ? ' as <code>' + esc(used.values.fromAddress) + '</code>' : '') +
          ' (' + (m.active === 'settings' ? 'stored in this instance' : 'the MAIL_CONFIG / MAIL_SMTP secret') + ').</p>'
        : '<p>No mail account: codes only go to the log. Set <code>MAIL_CONFIG</code> as a secret on this instance.</p>';
    }).catch(function (err) { $('mail').innerHTML = '<p class="msg error">' + esc(err.message) + '</p>'; });
  }

  $('testMail').addEventListener('submit', function (e) {
    e.preventDefault();
    api('POST', '/admin/mail/test', { to: $('tmTo').value.trim() }).then(function () { show($('tmMsg'), 'Sent - check the inbox (and spam).'); })
      .catch(function (err) { show($('tmMsg'), err.message, true); });
  });

  $('keyForm').addEventListener('submit', function (e) { e.preventDefault(); if ($('key').value) { cred = { bearer: $('key').value, kind: 'key' }; key = cred.bearer; connect(); } });
  $('signOut').addEventListener('click', function () { signedOut(''); show($('keyError'), ''); });
  $('reload').addEventListener('click', loadClients);
  if (location.pathname === '/callback') finishSignIn();
  else if (key) connect();
})();
</script>
</body>
</html>
